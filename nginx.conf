server {
    listen 80;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    # 1) Hanya alamat jaringan privat (LAN/VPN kantor) yang boleh masuk
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    # 2) Wajib login (user & password di file .htpasswd)
    auth_basic           "Dashboard Internal REY";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 3) Header keamanan dasar
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header X-Robots-Tag           "noindex, nofollow" always;
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css;

    location / {
        try_files $uri $uri/ =404;
    }

    # Data log tidak boleh di-cache browser/proxy
    location /data/ {
        add_header Cache-Control          "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        try_files $uri =404;
    }
}
