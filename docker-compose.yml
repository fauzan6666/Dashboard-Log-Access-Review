# Dashboard Log & Access Review — REY (internal only)
services:
  gws-dashboard:
    image: nginx:1.27.4-alpine
    container_name: gws-dashboard
    restart: unless-stopped
    ports:
      - "8088:80"          # akses: http://IP-SERVER:8088
    volumes:
      - /opt/gws-dashboard/site:/usr/share/nginx/html:ro
      - /opt/gws-dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/gws-dashboard/.htpasswd:/etc/nginx/.htpasswd:ro
